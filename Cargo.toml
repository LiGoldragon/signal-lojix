[package]
name         = "signal-lojix"
version      = "0.4.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
description  = "Ordinary Signal contract for the lojix deploy orchestrator component."
publish      = false
links        = "signal-lojix"
build        = "build.rs"

[lib]
name = "signal_lojix"
path = "src/lib.rs"

[features]
default   = []
dotos-text = ["dep:dotos", "signal-frame/dotos-text"]

[dependencies]
dotos   = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f", default-features = false }

[build-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "937dd7df657f685cdd1ebd6f2148ad428a8b36bf" }
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "4aa0bf9df2c3eaaccfd7abf9ae9547ab4f9a9b7f" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
