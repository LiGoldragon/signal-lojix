[package]
name = "signal-lojix"
version = "7.0.0"
edition = "2024"
rust-version = "1.89"
description = "Ordinary Signal contract for the Lojix deployment Nexus."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "horizon-lib/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "f35460de930943ea1a8a972453ccf3a092a655b5", default-features = false }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "2e09ebbdc725f64fd9ee102b5758bab85be217e1", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[lints.clippy]
# Contract variants preserve authored named payloads, including the complete
# typed configuration. Portable rkyv values must not gain heap indirection.
large_enum_variant = "allow"
