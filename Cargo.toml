[package]
name = "signal-lojix"
version = "5.0.0"
edition = "2024"
rust-version = "1.89"
description = "Ordinary Signal contract for the Lojix deployment Nexus."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "1febca7836bf8d5f5973a302fdd50aa9c84c159b", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false }
horizon-current = { package = "horizon-lib", git = "https://github.com/LiGoldragon/horizon-rs", rev = "37416e10c00cc6a22c73528759df5b15bd6d8428", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4bf73cae8d4f5a2072c76a11cd2f00aa3fe9f8e3" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[lints.clippy]
# Contract variants preserve authored named payloads, including the complete
# typed configuration. Portable rkyv values must not gain heap indirection.
large_enum_variant = "allow"
