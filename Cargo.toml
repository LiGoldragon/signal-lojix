[package]
name = "signal-lojix"
version = "5.0.0"
edition = "2024"
rust-version = "1.89"
description = "Ordinary Signal contract for the Lojix deployment Nexus."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "horizon-lib/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "ee8d6f8d27eb6e200504807971ffdd26aaca7ed1", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "de3d9928b156f2e1a92d060b7817af201abfdbef" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[lints.clippy]
# Contract variants preserve authored named payloads, including the complete
# typed configuration. Portable rkyv values must not gain heap indirection.
large_enum_variant = "allow"
