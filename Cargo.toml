[package]
name         = "signal-lojix"
version      = "0.8.3"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "Ordinary Signal contract for the lojix deploy orchestrator component."
publish      = false
links        = "signal-lojix"
build        = "build.rs"

[lib]
name = "signal_lojix"
path = "src/lib.rs"

[dependencies]
datom-codec   = { git = "https://github.com/LiGoldragon/datom-codec", rev = "41a3c073d5c5" }
protos        = { git = "https://github.com/LiGoldragon/protos", rev = "2d999f173334" }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "a0c0548a73f1" }
protos     = { git = "https://github.com/LiGoldragon/protos", rev = "2d999f173334" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
