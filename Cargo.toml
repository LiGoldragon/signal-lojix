[package]
name = "signal-lojix"
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
description = "Ordinary Signal contract for the Lojix deployment Nexus."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "horizon-lib/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "cd3c8a944609f97b0ff800a54fb384c9f21be9ca", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4695ee0c1f5d00dcf5cceba08f5fa00412b92184" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[lints.clippy]
# Contract variants preserve authored named payloads, including the complete
# typed configuration. Portable rkyv values must not gain heap indirection.
large_enum_variant = "allow"
