[package]
name         = "signal-lojix"
version      = "0.5.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
description  = "Ordinary Signal contract for the lojix deploy orchestrator component."
publish      = false
links        = "signal-lojix"
build        = "build.rs"

[lib]
name = "signal_lojix"
path = "src/lib.rs"

[features]
default   = []
nota-text = ["dep:nota", "signal-frame/nota-text"]

[dependencies]
nota    = { git = "https://github.com/LiGoldragon/nota.git", rev = "f8de7a516b769fc544c7f8c0030e258833c1cf9b", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "b61ec7d9e98e", default-features = false }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "ab366e40135992ef1f73791153b70b9c6ed0a972" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
